<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Рекомендации · RecSystem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="theme-color" content="#712cf9">
    <style>
        body { background-color: #0f0f10; }
        .page-container { padding-top: 2rem; padding-bottom: 2rem; }
    </style>
</head>
<body class="bg-body-tertiary">
{% include 'rec_system/navbar.html' %}

<div class="container page-container">
    <!-- Форма -->
    <div class="row justify-content-center mb-5">
        <div class="col-md-8 col-lg-6">
            <div class="p-4 bg-body rounded shadow-sm">
                <h4 class="text-center mb-4">Введите имя для подбора рекомендаций</h4>
                <form class="needs-validation" novalidate method="GET">
                    <div class="mb-3">
                        <label for="user" class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control" id="user" name="user"
                               value="{{ user|default:'' }}" placeholder="Например: Алексей" required>
                        <div class="invalid-feedback">Пожалуйста, введите имя.</div>
                    </div>
                    <div class="d-grid">
                        <button class="btn btn-primary btn-lg" type="submit">Получить рекомендации</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Результат -->
    {% if recommendations %}
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            {% if user %}
            <p class="text-center text-muted mb-3">Рекомендации для: <strong>{{ user }}</strong></p>
            {% endif %}
            <div class="list-group">
                {% for movie in recommendations %}
                <div class="list-group-item list-group-item-action bg-body rounded mb-2 border-0 shadow-sm">
                    {{ movie }}
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
</body>
</html>
