<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ввод предпочтений · RecSystem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="theme-color" content="#712cf9">
    <style>
        body { background-color: #0f0f10; }
        .page-container { padding-top: 2rem; padding-bottom: 2rem; }
    </style>
</head>
<body class="bg-body-tertiary">
{% include 'rec_system/navbar.html' %}

<div class="container page-container">
    <div class="py-5 text-center">
        <h1 class="h2">Страница ввода предпочтений</h1>
        <p class="lead">На этой странице вы можете ввести свое имя и просмотренный фильм.<br>
            Алгоритм подберет фильм, который вам понравится.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <h4 class="mb-3 text-center">Поля для ввода</h4>
            <form class="needs-validation" novalidate method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="firstName" class="form-label">Имя</label>
                    <input type="text" class="form-control" id="firstName" name="user" placeholder="" required>
                    <div class="invalid-feedback">Пожалуйста, введите имя.</div>
                </div>

                <div class="mb-3">
                    <label for="movie" class="form-label">Фильм</label>
                    <input type="text" class="form-control" id="movie" name="movie" placeholder="" required>
                    <div class="invalid-feedback">Пожалуйста, введите фильм.</div>
                </div>

                <hr class="my-4">
                <div class="d-grid">
                    <button class="btn btn-primary btn-lg" type="submit">Отправить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
</body>
</html>
